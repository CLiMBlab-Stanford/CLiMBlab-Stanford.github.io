name: Build site
description: Set up Ruby and build the Jekyll site into _site

inputs:
  purgecss:
    description: >-
      Strip unused CSS from the built site. Wanted by anything that serves or
      renders the site
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Ruby 💎
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.2.2"
        bundler-cache: true

    - name: Build 🔧
      shell: bash
      run: |
        export JEKYLL_ENV=production
        bundle exec jekyll build

    # Installed from package-lock.json
    - name: Purge unused CSS 🧹
      if: inputs.purgecss == 'true'
      shell: bash
      run: |
        npm ci
        npx purgecss -c purgecss.config.js
