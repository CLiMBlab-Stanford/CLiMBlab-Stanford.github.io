name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - "CONTRIBUTING.md"
      - "CUSTOMIZE.md"
      - "Dockerfile"
      - "LICENSE"
      - "README.md"
  pull_request:
    branches:
      - master
      - main
    paths-ignore:
      - "CONTRIBUTING.md"
      - "CUSTOMIZE.md"
      - "Dockerfile"
      - "LICENSE"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Build site 🔧
        uses: ./.github/actions/build-site
        with:
          purgecss: "true"
      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
